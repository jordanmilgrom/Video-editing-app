# Build roughcut.dxt on every vX.Y.Z tag, run an import smoke test on
# a real macOS arm64 runner, and upload the artifact to the Release.
#
# Three jobs:
#   1. build      — Linux-hosted cross-build. Outputs roughcut.dxt.
#   2. smoke-test — macos-14 (arm64). Unpacks the .dxt, runs the bundled
#                   python interpreter, imports mlx_whisper. Catches the
#                   class of regression where a native dylib gets dropped
#                   from the wheel set during cross-platform pip download.
#   3. release    — Linux-hosted. Creates / updates the GitHub Release
#                   and attaches roughcut.dxt. Only runs if smoke-test
#                   passed.

name: Release

on:
  push:
    tags:
      - 'v*'
  # v0.11.0: added workflow_dispatch so a release can be cut without
  # local git access (proxy blocks tag pushes). Enter the version like
  # "v0.11.0" and softprops/action-gh-release creates the tag at the
  # dispatching SHA and publishes the .dxt.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to create (e.g. v0.11.0)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # v0.6.5 P-22: run the Python unit tests first, including the
      # FCPXML validator's self-check on the canonical output. Catches
      # the v0.6.4 "Invalid edit with no respective media" regression
      # class before the .dxt build wastes CI time.
      - name: Install xmllint (libxml2-utils)
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run unit tests
        run: pytest -W ignore::DeprecationWarning

      - name: Emit + validate a canonical FCPXML
        run: |
          python -c "
          import tempfile
          from pathlib import Path
          from roughcut_core import fcpxml, fcpxml_validate
          from roughcut_core.models import SequenceSpec, ARollSegment, BRollInsert
          with tempfile.TemporaryDirectory() as t:
              t = Path(t)
              a = t/'interview.mov'; a.write_bytes(b'x')
              b = t/'broll.mov'; b.write_bytes(b'x')
              spec = SequenceSpec(
                  aroll=[ARollSegment(source_path=a, source_in_sec=0, source_out_sec=5),
                         ARollSegment(source_path=a, source_in_sec=10, source_out_sec=15)],
                  broll=[BRollInsert(source_path=b, source_in_sec=0,
                                     source_out_sec=2, timeline_offset_sec=1)],
              )
              out = t/'cut.fcpxml'
              fcpxml.write_fcpxml(spec, out)
              v = fcpxml_validate.validate_fcpxml(out)
              print(v)
              assert v['ok'], v['errors']
              assert v['details']['xmllint_run'] is True
              assert v['details']['xmllint_returncode'] == 0
          "

      - name: Build roughcut.dxt
        run: bash scripts/build-dxt.sh

      - name: Confirm artifact + show size
        run: |
          test -f roughcut.dxt
          ls -lh roughcut.dxt

      - name: Upload artifact for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: roughcut-dxt
          path: roughcut.dxt
          retention-days: 7

  smoke-test:
    needs: build
    runs-on: macos-14
    # No actions/checkout here — and that's intentional. With the repo
    # checked out at $PWD, Python's cwd-based import machinery would
    # load roughcut_core from the REPO copy (where models_catalog.py's
    # __file__ resolves to repo/models, which doesn't exist) instead of
    # the unpacked .dxt copy (where the bundled whisper-small lives).
    # Surfaced as: AssertionError: resolved 'small' to non-path: …
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: roughcut-dxt

      - name: Unpack the .dxt
        run: |
          mkdir unpacked
          # .dxt files are zip archives.
          unzip -q roughcut.dxt -d unpacked
          test -x unpacked/server/python/bin/python3.11

      - name: Import smoke test — mlx_whisper must load (catches missing libmlx.dylib)
        # The actual regression we're catching: `import mlx.core` triggers the
        # native C extension load, which is where dyld will fail to resolve
        # @rpath/libmlx.dylib if mlx-metal didn't make it into the bundle.
        run: |
          export PYTHONPATH="$PWD/unpacked/server:$PWD/unpacked/server/lib"
          export PATH="$PWD/unpacked/server/python/bin:$PWD/unpacked/server/bin:$PATH"
          python3.11 -c "
          import sys
          import mlx.core         # loads core.cpython-311-darwin.so → libmlx.dylib
          import mlx_whisper      # pulls in mlx + numba + etc.
          print(f'python      : {sys.version.split()[0]}')
          print(f'mlx_whisper : {getattr(mlx_whisper, \"__version__\", \"?\")}')
          print('OK')
          "

      - name: ffmpeg / ffprobe must be executable
        run: |
          unpacked/server/bin/ffmpeg -version | head -1
          unpacked/server/bin/ffprobe -version | head -1

      - name: whisper-small must be bundled (v0.6.1 promise)
        run: |
          test -d unpacked/server/models/whisper-small
          test -f unpacked/server/models/whisper-small/config.json
          du -sh unpacked/server/models/whisper-small

      - name: Offline transcribe smoke test (HF_HUB_OFFLINE=1)
        # Generate a tiny silent WAV, transcribe with the bundled small
        # model, prove there's no network round-trip. Catches the
        # regression where the bundled model isn't actually picked up.
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          export PYTHONPATH="$PWD/unpacked/server:$PWD/unpacked/server/lib"
          export PATH="$PWD/unpacked/server/python/bin:$PWD/unpacked/server/bin:$PATH"
          ffmpeg -y -loglevel error -f lavfi -i "anullsrc=r=16000:cl=mono" -t 2 /tmp/silence.wav
          mkdir -p /tmp/rc-cache
          python3.11 - <<'PY'
          from pathlib import Path
          from roughcut_core import models_catalog, transcribe
          resolved = models_catalog.resolve("small")
          assert Path(resolved).is_dir(), f"resolved 'small' to non-path: {resolved}"
          print(f"resolved small -> {resolved}")
          t = transcribe.transcribe(
              Path("/tmp/silence.wav"), Path("/tmp/rc-cache"), model=resolved,
          )
          print(f"offline transcribe ok: {len(t.segments)} segments, lang={t.language}")
          PY

      - name: Job-system end-to-end smoke test
        # Spawns a tiny _test_noop job in the unpacked bundle, polls until
        # succeeded, then exercises: cancel_job on an unknown id, list_jobs,
        # and the startup recover_interrupted scan. Catches breakage in the
        # subprocess plumbing without burning time on a real transcription.
        run: |
          export PYTHONPATH="$PWD/unpacked/server:$PWD/unpacked/server/lib"
          export ROUGHCUT_CACHE_DIR="$PWD/smoke-cache"
          python3.11 - <<'PY'
          import os, time, sys
          from pathlib import Path
          from roughcut_core import jobs

          cache = Path(os.environ["ROUGHCUT_CACHE_DIR"])
          cache.mkdir(parents=True, exist_ok=True)

          # 1. Spawn — must return immediately with a job_id.
          j = jobs.spawn(cache, "_test_noop", {"k": "smoke"})
          assert j.job_id, f"no job_id: {j}"
          print(f"spawned job_id={j.job_id} status={j.status}")

          # 2. Poll for succeeded.
          deadline = time.time() + 10
          last = j
          while time.time() < deadline:
              last = jobs.read(cache, j.job_id)
              if last and last.status in {"succeeded", "failed"}:
                  break
              time.sleep(0.1)
          assert last.status == "succeeded", f"job didn't succeed: {last}"
          assert last.result_summary == {"echo": "ok"}, last.result_summary
          print(f"job succeeded: result_summary={last.result_summary}")

          # 3. Idempotency: a re-spawn with same args returns the cached job.
          j2 = jobs.spawn(cache, "_test_noop", {"k": "smoke"})
          assert j2.job_id == j.job_id and j2.status == "succeeded"
          print(f"idempotent: re-spawn returned cached job_id={j2.job_id}")

          # 4. Cancel: forge a fake running job, cancel it, status flips.
          fake = jobs.Job(
              job_id="bogus", tool_name="transcribe_video", args={},
              status="running", started_at=time.time(), updated_at=time.time(),
              pid=999_999_999,
          )
          jobs.write(cache, fake)
          out = jobs.cancel(cache, "bogus")
          assert out.status == "cancelled", out

          # 5. Recover scan: a 'running' job with a dead pid → interrupted.
          fake2 = jobs.Job(
              job_id="dead", tool_name="transcribe_video", args={},
              status="running", started_at=time.time(), updated_at=time.time(),
              pid=999_999_998,
          )
          jobs.write(cache, fake2)
          touched = jobs.recover_interrupted(cache)
          ids = {t.job_id for t in touched}
          assert "dead" in ids, ids
          print(f"recover marked: {ids}")

          # 6. Unknown id: read() returns None (caller maps to clean error).
          assert jobs.read(cache, "no-such-id") is None
          print("OK")
          PY

      - name: Concurrency burst — 20 jobs + list_jobs <1s (v0.6.3 lockup guard)
        # v0.6.0..v0.6.2 spawned a subprocess per job → 31 parallel
        # transcribe calls deadlocked the MCP server (Jordan's production
        # crash). v0.6.3 enqueues against a single persistent worker.
        # Fire 20 spawns in a tight loop, then immediately list_jobs —
        # both must return fast, regardless of whether the worker has
        # caught up yet.
        run: |
          export PYTHONPATH="$PWD/unpacked/server:$PWD/unpacked/server/lib"
          export ROUGHCUT_CACHE_DIR="$PWD/burst-cache"
          python3.11 - <<'PY'
          import os, time
          from pathlib import Path
          from roughcut_core import jobs

          cache = Path(os.environ["ROUGHCUT_CACHE_DIR"])
          cache.mkdir(parents=True, exist_ok=True)

          t0 = time.time()
          ids = [jobs.spawn(cache, "_test_noop", {"burst": i}).job_id for i in range(20)]
          spawn_elapsed = time.time() - t0
          print(f"20 spawns in {spawn_elapsed:.3f}s")
          assert len(set(ids)) == 20
          assert spawn_elapsed < 3.0, f"20 spawns took {spawn_elapsed:.2f}s — too slow"

          t1 = time.time()
          listed = jobs.list_jobs(cache)
          list_elapsed = time.time() - t1
          print(f"list_jobs({len(listed)} jobs) in {list_elapsed:.3f}s")
          assert len(listed) >= 20
          assert list_elapsed < 1.0, f"list_jobs took {list_elapsed:.2f}s — target <1s"
          print("OK")
          PY

      - name: Documentary mode — read_transcript pagination + search hit
        # Lay down a synthetic transcript with two distinct phrases, then
        # exercise read_transcript pagination and a search_transcripts hit.
        # No mlx-whisper involved.
        run: |
          export PYTHONPATH="$PWD/unpacked/server:$PWD/unpacked/server/lib"
          export ROUGHCUT_CACHE_DIR="$PWD/docs-cache"
          mkdir -p docs-cache/transcripts/test
          python3.11 - <<'PY'
          import json, os
          from pathlib import Path
          from roughcut_core import documentary
          from roughcut_core.models import Segment, Transcript

          cache = Path(os.environ["ROUGHCUT_CACHE_DIR"])
          src = cache / "fake.mp4"; src.touch()
          path = cache / "transcripts" / "test" / "fake.json"
          # Long enough to force pagination at a small max_chars.
          segments = [Segment(text=f"Wisconsin chunk {i} " + "x" * 400,
                              start=float(i), end=float(i + 1)) for i in range(8)]
          path.write_text(Transcript(
              source_path=src, source_hash="h", duration=8.0,
              language="en", segments=segments,
          ).model_dump_json())

          page1 = documentary.read_transcript(path, max_chars=1500)
          assert page1["has_more"] is True, page1
          assert page1["segments"][0]["text"].startswith("Wisconsin chunk 0")

          page2 = documentary.read_transcript(
              path, start_segment=page1["next_start"], max_chars=1500,
          )
          assert page2["segments"][0]["idx"] == page1["next_start"]

          hits = documentary.search_transcripts("Wisconsin", cache)
          assert hits["result_count"] >= 1, hits
          assert "Wisconsin" in hits["results"][0]["matched_text"]
          print("OK")
          PY

  release:
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: roughcut-dxt

      - name: Create GitHub Release and upload .dxt
        uses: softprops/action-gh-release@v2
        with:
          # Use the manual input when workflow_dispatch fires; fall back
          # to the pushed tag ref name for the classic tag-push flow.
          tag_name: ${{ inputs.version || github.ref_name }}
          files: roughcut.dxt
          generate_release_notes: true
          fail_on_unmatched_files: true
