[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roughcut"
version = "0.2.0"
description = "MCP-first rough-cut tool: deterministic video capabilities for agent-driven editing."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "roughcut" }]
dependencies = [
    "pydantic>=2.7",
    "ffmpeg-python>=0.2.0",
    "Pillow>=10.3",
    "mlx-whisper>=0.4 ; platform_system == 'Darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[tool.setuptools.packages.find]
include = ["roughcut_core*", "roughcut_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
